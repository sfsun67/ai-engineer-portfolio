# Portfolio site — added to the host edge nginx (alongside the other sites here).
#   www.positivevibe.cn / positivevibe.cn → dockerized static SPA (portfolio-site, 127.0.0.1:8080)
# Deploy: copy to /etc/nginx/conf.d/positivevibe.conf, then `nginx -t && nginx -s reload`.

# ---- HTTP → HTTPS (and apex → www) ----
server {
    listen 80;
    listen [::]:80;
    server_name www.positivevibe.cn positivevibe.cn;
    location / { return 301 https://www.positivevibe.cn$request_uri; }
}

# ---- apex HTTPS → www ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name positivevibe.cn;

    ssl_certificate     /etc/nginx/ssl/www.positivevibe.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.positivevibe.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    return 301 https://www.positivevibe.cn$request_uri;
}

# ---- www host (portfolio SPA) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.positivevibe.cn;

    ssl_certificate     /etc/nginx/ssl/www.positivevibe.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.positivevibe.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
