# Container-internal nginx: serves the static Vite SPA build.
# The host edge nginx (www.positivevibe.cn) reverse-proxies to this container.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/wasm;

    # Hashed Vite assets — immutable, cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback. index.html must NOT be cached so deploys take effect.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
